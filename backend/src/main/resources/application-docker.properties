spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://db:3306/medicalytics}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medicalytics}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:medicalytics}
spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
