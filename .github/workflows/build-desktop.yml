name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/**'
    paths:
      - 'frontend/**'
      - 'scripts/build-frontend.*'
      - '.github/workflows/build-desktop.yml'

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            artifact: medicalytics-desktop-linux-x64.tar.gz
          - os: windows-latest
            label: windows-x64
            artifact: medicalytics-desktop-windows-x64.zip
          - os: macos-latest
            label: macos-arm64
            artifact: medicalytics-desktop-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build standalone desktop app
        shell: bash
        run: |
          chmod +x backend/mvnw scripts/build-frontend.sh
          ./scripts/build-frontend.sh

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
