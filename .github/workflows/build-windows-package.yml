name: Build Windows Portable Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build medicalytics-windows-portable.zip
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build portable Windows package
        shell: pwsh
        env:
          CI: true
        run: ./scripts/build-windows-package.ps1

      - name: Verify package
        shell: pwsh
        run: |
          $zip = "dist/medicalytics-windows-portable.zip"
          if (-not (Test-Path $zip)) {
            throw "Package not found: $zip"
          }
          $sizeMb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Package size: $sizeMb MB"
          if ($sizeMb -lt 50) {
            throw "Package looks too small ($sizeMb MB). Build may have failed partially."
          }

      - name: Upload portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: medicalytics-windows-portable
          path: dist/medicalytics-windows-portable.zip
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Publish to GitHub Releases (latest Windows build)
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: windows-portable-latest
          name: Medicalytics for Windows
          body: |
            ## Download and run

            1. Download **medicalytics-windows-portable.zip** below
            2. Extract the folder
            3. Double-click **Medicalytics.cmd**
            4. Wait 1–2 minutes on first launch (database setup)

            No Java, Docker, or MariaDB installation required.

            **Direct link:** https://github.com/${{ github.repository }}/releases/latest/download/medicalytics-windows-portable.zip

            Built from `${{ github.sha }}` (workflow run ${{ github.run_number }}).
          artifacts: dist/medicalytics-windows-portable.zip
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/medicalytics-windows-portable.zip
          generate_release_notes: true

      - name: Build summary
        shell: pwsh
        run: |
          $sizeMb = [math]::Round((Get-Item "dist/medicalytics-windows-portable.zip").Length / 1MB, 1)
          @"
          ## Windows portable package

          - **File:** medicalytics-windows-portable.zip ($sizeMb MB)
          - **Run:** ${{ github.run_number }}

          ### Download for end users

          **[GitHub Releases (recommended)](https://github.com/${{ github.repository }}/releases/latest)**

          Direct download: https://github.com/${{ github.repository }}/releases/latest/download/medicalytics-windows-portable.zip

          Extract the zip and double-click **Medicalytics.cmd**.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
